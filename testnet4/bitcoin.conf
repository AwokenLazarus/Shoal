# Bitcoin Knots (XBT, BLAKE2b) on testnet4, for a Shoal node beside it.
testnet4=1
server=1
dbcache=1024

[testnet4]
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcuser=shoal
rpcpassword=CHANGE-ME
zmqpubhashblock=tcp://127.0.0.1:28332
# An XBT (BLAKE2b) testnet4 node, so Knots does not sit on SHA-256d peers only: Shoal's
# bootstrap node (see TESTNET4-ALPHA.md).
addnode=SHOAL_BOOTSTRAP_IP:48333
